{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-custom">
            <div class="card-header card-header-purple py-3">
                <h4 class="mb-0 fw-bold"><i class="fa-solid fa-id-card me-2"></i> User Profile Settings</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('profile') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Email Address (Read-only)</label>
                        <input type="email" class="form-control bg-light" value="{{ current_user.email }}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Assigned Role</label>
                        <input type="text" class="form-control bg-light" value="{{ current_user.role }}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Full Name</label>
                        <input type="text" name="full_name" class="form-control" value="{{ current_user.full_name }}" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Change Password (Leave blank to keep current)</label>
                        <input type="password" name="new_password" class="form-control" placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn-purple w-100 py-2 fw-bold shadow-sm">
                        Save Changes
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
